name: Build SpotiTube Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Production HTTPS URL for SpotiTube (leave default or set your Vercel URL)"
        required: false
        default: "https://ais-pre-6gdewyilmuy24zlnrxq6or-846997521525.europe-west2.run.app"
  push:
    paths:
      - "android/**"
      - "src/**"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20 & bundle web app inside APK
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Build bundled web assets
        run: |
          npm ci
          npm run build
          rm -rf android/app/src/main/assets
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/
          rm -f android/app/src/main/assets/SpotiTube.apk

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Debug APK
        working-directory: android
        env:
          SPOTITUBE_APP_URL: ${{ github.event.inputs.app_url || 'https://ais-pre-6gdewyilmuy24zlnrxq6or-846997521525.europe-west2.run.app' }}
        run: gradle assembleDebug --no-daemon

      - name: Rename APK output
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SpotiTube.apk

      - name: Upload SpotiTube.apk artifact
        uses: actions/upload-artifact@v4
        with:
          name: SpotiTube-Android-APK
          path: SpotiTube.apk
