<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="kwBg" x1="16" y1="8" x2="112" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#171113"/>
      <stop offset="55%" stop-color="#0B0809"/>
      <stop offset="100%" stop-color="#050405"/>
    </linearGradient>
    <radialGradient id="kwGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.34"/>
      <stop offset="70%" stop-color="#DC2626" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#070607" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="kwRed" x1="30" y1="24" x2="98" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF5A52"/>
      <stop offset="48%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="kwBorder" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.72"/>
      <stop offset="50%" stop-color="#DC2626" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <!-- Obsidian 3D Tile Base -->
  <rect width="128" height="128" rx="30" fill="url(#kwBg)"/>
  <rect width="128" height="128" rx="30" fill="url(#kwGlow)"/>
  <rect x="2.5" y="2.5" width="123" height="123" rx="28" stroke="url(#kwBorder)" stroke-width="2.5"/>

  <!-- Outer Precision Vinyl Ring -->
  <circle cx="64" cy="64" r="41" stroke="#EF4444" stroke-opacity="0.24" stroke-width="2"/>
  <circle cx="64" cy="64" r="34" stroke="url(#kwRed)" stroke-width="3.2"/>

  <!-- Bold Soundwave + Music Crest -->
  <rect x="44" y="54" width="6.5" height="20" rx="3.25" fill="url(#kwRed)"/>
  <rect x="54.5" y="42" width="6.5" height="44" rx="3.25" fill="#FFFFFF"/>
  <rect x="65" y="48" width="6.5" height="32" rx="3.25" fill="url(#kwRed)"/>
  <rect x="75.5" y="56" width="6.5" height="16" rx="3.25" fill="#F87171"/>

  <!-- Top Play Crest Dot -->
  <circle cx="57.75" cy="34.5" r="2.6" fill="#EF4444"/>
</svg>
